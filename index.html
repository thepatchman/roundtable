<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Round Table</title>
<meta name="description" content="Seat up to five AI models around one table, put a question in the middle, and watch them answer each other in turn.">
<meta property="og:title" content="Round Table">
<meta property="og:description" content="One question. Five AI models. They answer each other in turn.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{--room:#14120F;--room-2:#1C1915;--room-3:#242019;--line:#2F2B23;--chalk:#EDE7DA;--dim:#A29B8C;--faint:#6B6559;--brass:#C9A227;--bad:#C4623F;--display:"Newsreader",Georgia,serif;--ui:"Archivo",system-ui,-apple-system,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--room);color:var(--chalk);font-family:var(--ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
main{max-width:860px;margin:0 auto;padding:0 18px 80px}
.top{max-width:860px;margin:0 auto;padding:18px 18px 0;display:flex;align-items:center;justify-content:space-between;gap:14px}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-size:1.1rem}
.brand .mark{width:24px;height:24px;color:var(--brass)}
.acct{font-family:var(--mono);font-size:10px;color:var(--faint);letter-spacing:0.08em;text-transform:uppercase;cursor:pointer}
.acct:hover{color:var(--dim)}

/* the stage is the interface */
.stage{position:relative;margin-top:4px}
.stage svg{display:block;width:100%;height:auto}
.centre{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 10px;gap:10px}
.centre-q{font-family:var(--display);font-weight:300;font-size:20px;line-height:1.3;color:var(--chalk);margin:0;cursor:text;text-wrap:balance}
.centre-q.ask{color:var(--faint);font-style:italic}
.centre-sub{font-family:var(--mono);font-size:9.5px;letter-spacing:0.16em;text-transform:uppercase;color:var(--faint);margin:0}
.centre button{font-family:var(--ui);font-size:0.92rem;font-weight:500;background:var(--brass);color:#1A1508;border:0;border-radius:3px;padding:9px 18px;cursor:pointer}
.centre button:hover{opacity:0.88}

.centre{pointer-events:auto}
#connect-block,#ask-block{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;width:100%}
#question{width:100%;background:transparent;border:0;outline:0;resize:none;overflow:hidden;text-align:center;font-family:var(--display);font-weight:300;font-size:21px;line-height:1.32;color:var(--chalk);padding:0;max-height:88px}
#question::placeholder{color:#6F6A5E;font-style:italic}
#question:focus{outline:0}
.felt-rule{width:54px;height:1px;background:#8A7430;opacity:.45}
.seat-hit{cursor:pointer}
.seat-hit:hover .chair-empty{stroke:var(--brass)}
.seat-hit:focus-visible{outline:2px solid var(--brass);outline-offset:3px}
.chair-empty{fill:none;stroke:#443F37;stroke-width:1.6;stroke-dasharray:5 5;transition:stroke 160ms ease}
.seat-label{font-family:var(--mono);font-size:9.5px;letter-spacing:1.1px;fill:#5E594E;text-transform:uppercase}
.figure{transition:opacity 260ms ease}
.figure.idle{opacity:0.32}
.body-g{animation:breathe 4.4s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-1.2px) scale(1.012)}}
.figure.speaking .body-g{animation:lean 1.5s ease-in-out infinite}
@keyframes lean{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-4px) scale(1.045)}}
.halo{opacity:0}
.figure.speaking .halo{opacity:1;animation:pulse 2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0.2;r:40}50%{opacity:0.6;r:47}}
.ring2{opacity:0}
.figure.speaking .ring2{animation:ripple 2.6s ease-out infinite}
@keyframes ripple{0%{opacity:0.4;r:38}100%{opacity:0;r:72}}
.think{opacity:0}
.figure.speaking .think{opacity:1}
.figure.speaking .think circle{animation:blink 1.3s ease-in-out infinite}
.figure.speaking .think circle:nth-child(2){animation-delay:0.19s}
.figure.speaking .think circle:nth-child(3){animation-delay:0.38s}
@keyframes blink{0%,70%,100%{opacity:0.2}35%{opacity:1}}

.bubbles{position:absolute;inset:0;pointer-events:none}
.bubble{position:absolute;left:var(--bx);top:var(--by);transform:translate(-50%,-50%);width:min(31%,250px);background:#F3EFE6;color:#191714;border-radius:14px;padding:11px 13px;font-size:0.84rem;line-height:1.45;box-shadow:0 10px 34px rgba(0,0,0,.5);max-height:190px;overflow-y:auto;pointer-events:auto}
.bubble .who{font-family:var(--mono);font-size:8.5px;letter-spacing:0.12em;text-transform:uppercase;display:block;margin-bottom:5px;opacity:0.55}

/* seat picker, over the table */
.picker{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(12,11,9,.82);backdrop-filter:blur(3px);z-index:5}
.picker[hidden]{display:none}
.sheet{background:var(--room-2);border:1px solid var(--line);border-radius:6px;padding:18px;width:min(92%,420px);max-height:86%;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.sheet h3{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0 0 3px}
.sheet .hint{font-family:var(--mono);font-size:9.5px;letter-spacing:0.12em;text-transform:uppercase;color:var(--faint);margin:0 0 14px}
.brands{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.brandbtn{display:flex;flex-direction:column;align-items:center;gap:7px;padding:14px 8px;background:var(--room-3);border:1px solid var(--line);border-radius:4px;color:var(--chalk);font-family:var(--ui);font-size:0.86rem;cursor:pointer;transition:border-color 140ms ease}
.brandbtn:hover{border-color:var(--brass)}
.brandbtn .swatch{width:22px;height:22px;border-radius:50%}
.brandbtn.none{opacity:0.35;cursor:not-allowed}
.models{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.modelbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left;padding:10px 12px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--chalk);font-family:var(--ui);font-size:0.9rem;cursor:pointer;width:100%}
.modelbtn:hover{background:var(--room-3)}
.modelbtn .tag{font-family:var(--mono);font-size:9px;color:var(--faint);letter-spacing:0.06em;flex:none}
.sheetfoot{display:flex;gap:9px;margin-top:14px;flex-wrap:wrap}
.tiny{background:transparent;border:1px solid var(--line);color:var(--chalk);border-radius:3px;padding:7px 13px;font-family:var(--ui);font-size:0.85rem;cursor:pointer}
.tiny:hover{border-color:var(--faint)}
.tiny.warn:hover{border-color:var(--bad);color:var(--bad)}

/* the one control bar */
.bar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;justify-content:center;margin-top:6px}
.go{font-family:var(--ui);font-size:1rem;font-weight:500;background:var(--brass);color:#1A1508;border:1px solid var(--brass);border-radius:3px;padding:11px 28px;cursor:pointer}
.go:hover{opacity:.88}
.go[disabled]{opacity:.25;cursor:not-allowed}
select,textarea,input[type=password]{font-family:var(--ui);font-size:.9rem;background:var(--room);color:var(--chalk);border:1px solid var(--line);border-radius:3px;padding:8px 10px}
.qbox{width:100%;margin-top:14px;resize:vertical;font-size:1rem;line-height:1.5;padding:12px}
.qbox[hidden]{display:none}
.status{font-family:var(--mono);font-size:10.5px;color:var(--faint);letter-spacing:.05em;text-align:center;margin:12px 0 0;min-height:1.2em}
.status.live{color:var(--brass)}
.status.bad{color:var(--bad)}
.field{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

.interject{max-width:560px;margin:14px auto 0;display:flex;flex-direction:column;gap:9px}
.interject[hidden]{display:none}

.log{max-width:660px;margin:34px auto 0;border-top:1px solid var(--line);padding-top:8px}
.log[hidden]{display:none}
.loghead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:10px 0}
.loghead h2{font-family:var(--display);font-weight:400;font-size:1.3rem;margin:0}
.turn{display:flex;gap:13px;padding:16px 0;border-bottom:1px solid var(--line)}
.turn:last-child{border-bottom:0}
.turn .mark{width:9px;height:9px;border-radius:50%;flex:none;margin-top:8px}
.turn .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.turn .said{margin:0;white-space:pre-wrap}
.turn.failed .said{color:var(--bad);font-style:italic}
.turn.human .said{color:var(--brass)}
.turn.human .mark{background:var(--chalk)}
footer{max-width:660px;margin:52px auto 0;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:.85rem}
footer p{margin:0 0 10px}
@media(max-width:700px){.bubbles{position:static}.bubble{position:static;transform:none;width:100%;margin-top:10px;max-height:none}.centre-q{font-size:16px}.brands{grid-template-columns:repeat(2,1fr)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.figure.speaking .halo,.figure.speaking .think{opacity:1}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="mark" viewBox="0 0 24 24" aria-hidden="true">
      <ellipse cx="12" cy="13" rx="8" ry="5" fill="none" stroke="currentColor" stroke-width="1.3"/>
      <circle cx="12" cy="4.5" r="2.1" fill="currentColor"/><circle cx="20.5" cy="10" r="2.1" fill="currentColor"/>
      <circle cx="17" cy="20" r="2.1" fill="currentColor"/><circle cx="7" cy="20" r="2.1" fill="currentColor"/>
      <circle cx="3.5" cy="10" r="2.1" fill="currentColor"/>
    </svg>
    <span>Round Table</span>
  </div>
  <span class="acct" id="acct" hidden></span>
</header>

<main>
<div class="stage" id="stage">
  <svg id="table" viewBox="0 0 900 620" aria-label="A round table with five seats">
    <defs><radialGradient id="felt" cx="50%" cy="42%" r="62%">
      <stop offset="0%" stop-color="#25493F"/><stop offset="100%" stop-color="#173029"/>
    </radialGradient></defs>
    <ellipse cx="450" cy="322" rx="248" ry="148" fill="#101F1B"/>
    <ellipse cx="450" cy="310" rx="248" ry="148" fill="url(#felt)" stroke="#8A7430" stroke-width="2"/>
    <ellipse cx="450" cy="310" rx="210" ry="118" fill="none" stroke="#8A7430" stroke-width="1" opacity=".4"/>
    <foreignObject x="248" y="244" width="404" height="134">
      <div xmlns="http://www.w3.org/1999/xhtml" class="centre" id="centre"><div id="connect-block"><p class="centre-q">Five seats. One question.</p><button type="button" id="connect-btn">Connect OpenRouter</button><p class="centre-sub" id="paste-link" style="cursor:pointer">or paste a key</p></div><div id="ask-block" hidden><textarea id="question" rows="2" placeholder="Ask them something…">Is it rational to be worried about AI agents talking to each other?</textarea><span class="felt-rule"></span><p class="centre-sub" id="seated-line">all seats open</p></div></div>
    </foreignObject>
    <g id="chairs"></g>
  </svg>
  <div class="bubbles" id="bubbles"></div>
  <div class="picker" id="picker" hidden>
    <div class="sheet" id="sheet"></div>
  </div>
</div>

<div class="bar" id="bar" hidden>
  <button class="go" id="begin">Begin</button>
  <button class="tiny" id="pause" disabled>Pause</button>
  <button class="tiny" id="stop" disabled>Stop</button>
  <span class="field">mode</span>
  <select id="mode"><option value="relay" selected>Relay</option><option value="blind">Blind</option></select>
  <span class="field">laps</span>
  <select id="laps"><option>1</option><option selected>2</option><option>3</option></select>
</div>
<p class="status" id="status"></p>

<div class="interject" id="interject" hidden>
  <textarea id="say" rows="2" placeholder="Cut in..."></textarea>
  <div class="bar">
    <button class="tiny" id="say-it">Say it and resume</button>
    <button class="tiny" id="resume">Resume without me</button>
  </div>
</div>

<div class="log" id="log" hidden>
  <div class="loghead">
    <h2>The round</h2>
    <div class="bar"><button class="tiny" id="copy">Copy</button><button class="tiny" id="clear">Clear</button></div>
  </div>
  <div id="turns"></div>
</div>

<footer>
  <p>Every answer comes from the model named beside it, through OpenRouter, billed to your own account. There is no server here.</p>
  <p>Models agree more than you would hope. The useful part of a round is rarely the consensus — it is the one seat that breaks from it.</p>
</footer>
</main>
<script>
(function () {
  "use strict";
  var OR = "https://openrouter.ai/api/v1";
  var AUTH = "https://openrouter.ai/auth";
  var MAX = 5;
  var KEY_STORE = "roundtable.key";
  var VER_STORE = "roundtable.verifier";
  var $ = function (id) { return document.getElementById(id); };

  /* The six houses. Everything the picker shows is derived from these —
     a visitor chooses a name they already know, then a model, and never
     sees an OpenRouter slug unless they go looking. */
  var BRANDS = [
    { id: "anthropic", label: "Claude",   prefix: "anthropic/",  hue: "#D97757" },
    { id: "openai",    label: "ChatGPT",  prefix: "openai/",     hue: "#10A37F" },
    { id: "google",    label: "Gemini",   prefix: "google/",     hue: "#4285F4" },
    { id: "xai",       label: "Grok",     prefix: "x-ai/",       hue: "#9AA0A6" },
    { id: "deepseek",  label: "DeepSeek", prefix: "deepseek/",   hue: "#4D6BFE" },
    { id: "meta",      label: "Meta",     prefix: "meta-llama/", hue: "#0866FF" }
  ];

  var S = { key: null, models: [], seats: [null,null,null,null,null],
            transcript: [], running: false, paused: false, stopping: false,
            controller: null, speaking: null, pickingSeat: null };

  function getKey(){ try { return localStorage.getItem(KEY_STORE); } catch(e){ return null; } }
  function putKey(k){ try { k ? localStorage.setItem(KEY_STORE,k) : localStorage.removeItem(KEY_STORE); } catch(e){} }

  /* ---- PKCE ---- */
  function b64url(bytes){
    var s = "";
    for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
    return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
  }
  function verifier(){ var b = new Uint8Array(64); crypto.getRandomValues(b); return b64url(b); }
  function challenge(v){
    return crypto.subtle.digest("SHA-256", new TextEncoder().encode(v))
      .then(function(d){ return b64url(new Uint8Array(d)); });
  }
  function connect(){
    var v = verifier();
    try { sessionStorage.setItem(VER_STORE, v); } catch(e){}
    challenge(v).then(function(c){
      location.href = AUTH + "?callback_url=" + encodeURIComponent(location.origin + location.pathname) +
        "&code_challenge=" + encodeURIComponent(c) + "&code_challenge_method=S256";
    });
  }
  function finish(code){
    var v = null;
    try { v = sessionStorage.getItem(VER_STORE); } catch(e){}
    if (!v) { pasteFallback("That sign-in began in another tab."); return; }
    say("Signing in...", "live");
    fetch(OR + "/auth/keys", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: code, code_verifier: v, code_challenge_method: "S256" })
    }).then(function(r){ return r.json().then(function(j){ return { ok:r.ok, status:r.status, j:j }; }); })
      .then(function(o){
        if (!o.ok || !o.j || !o.j.key) { pasteFallback("OpenRouter did not return a key (HTTP " + o.status + ")."); return; }
        try { sessionStorage.removeItem(VER_STORE); } catch(e){}
        adopt(o.j.key);
      })
      .catch(function(e){ pasteFallback("Could not reach OpenRouter. " + e.message); });
  }
  function adopt(k){
    S.key = k; putKey(k);
    history.replaceState({}, "", location.pathname);
    loadModels();
  }
  function signOut(){
    S.key = null; putKey(null); S.models = [];
    S.seats = [null,null,null,null,null];
    S.transcript = []; drawLog(); render();
  }

  function loadModels(){
    say("Loading models...", "live");
    fetch(OR + "/models", { headers: { Authorization: "Bearer " + S.key } })
      .then(function(r){ if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then(function(b){
        S.models = (b.data || []).filter(function(m){ return m && m.id && !/embed/i.test(m.id); });
        say("");
        seatDefaults();
        render();
      })
      .catch(function(e){ pasteFallback("Signed in, but the model list failed: " + e.message); });
  }

  /* Models of one house, newest first, names cleaned of the vendor prefix. */
  function modelsOf(brand){
    return S.models
      .filter(function(m){ return m.id.indexOf(brand.prefix) === 0; })
      .sort(function(a,b){ return (b.created || 0) - (a.created || 0); })
      .slice(0, 14)
      .map(function(m){
        var n = m.name || m.id.split("/")[1];
        var i = n.indexOf(": ");
        return { id: m.id, name: i >= 0 ? n.slice(i + 2) : n, free: /:free$/.test(m.id) };
      });
  }

  /* Open with one of each of the first four houses that has anything. */
  function seatDefaults(){
    var i = 0;
    for (var b = 0; b < BRANDS.length && i < 4; b++) {
      var list = modelsOf(BRANDS[b]);
      if (list.length) { S.seats[i] = { id: list[0].id, name: list[0].name, brand: BRANDS[b] }; i++; }
    }
  }

  /* ---- the picker ---- */
  function openPicker(seat){
    S.pickingSeat = seat;
    var taken = S.seats[seat];
    var sheet = $("sheet");
    sheet.innerHTML = "";

    var h = document.createElement("h3");
    h.textContent = taken ? taken.name : "Seat " + (seat + 1);
    var hint = document.createElement("p");
    hint.className = "hint";
    hint.textContent = taken ? "seated" : "choose a house";
    sheet.appendChild(h); sheet.appendChild(hint);

    var grid = document.createElement("div");
    grid.className = "brands";
    BRANDS.forEach(function(br){
      var list = modelsOf(br);
      var b = document.createElement("button");
      b.className = "brandbtn" + (list.length ? "" : " none");
      b.type = "button";
      b.disabled = !list.length;
      var sw = document.createElement("span");
      sw.className = "swatch"; sw.style.background = br.hue;
      var nm = document.createElement("span"); nm.textContent = br.label;
      b.appendChild(sw); b.appendChild(nm);
      b.addEventListener("click", function(){ showModels(br); });
      grid.appendChild(b);
    });
    sheet.appendChild(grid);

    var foot = document.createElement("div");
    foot.className = "sheetfoot";
    if (taken) {
      var rm = document.createElement("button");
      rm.className = "tiny warn"; rm.type = "button"; rm.textContent = "Empty this seat";
      rm.addEventListener("click", function(){ S.seats[seat] = null; closePicker(); render(); });
      foot.appendChild(rm);
    }
    var cx = document.createElement("button");
    cx.className = "tiny"; cx.type = "button"; cx.textContent = "Cancel";
    cx.addEventListener("click", closePicker);
    foot.appendChild(cx);
    sheet.appendChild(foot);

    $("picker").hidden = false;
  }

  function showModels(br){
    var sheet = $("sheet");
    sheet.innerHTML = "";
    var h = document.createElement("h3"); h.textContent = br.label;
    var hint = document.createElement("p"); hint.className = "hint"; hint.textContent = "which one";
    sheet.appendChild(h); sheet.appendChild(hint);

    var wrap = document.createElement("div"); wrap.className = "models";
    modelsOf(br).forEach(function(m){
      var b = document.createElement("button");
      b.className = "modelbtn"; b.type = "button";
      var nm = document.createElement("span"); nm.textContent = m.name;
      b.appendChild(nm);
      if (m.free) { var t = document.createElement("span"); t.className = "tag"; t.textContent = "FREE"; b.appendChild(t); }
      b.addEventListener("click", function(){
        S.seats[S.pickingSeat] = { id: m.id, name: m.name, brand: br };
        closePicker(); render();
      });
      wrap.appendChild(b);
    });
    sheet.appendChild(wrap);

    var foot = document.createElement("div"); foot.className = "sheetfoot";
    var back = document.createElement("button");
    back.className = "tiny"; back.type = "button"; back.textContent = "Back";
    back.addEventListener("click", function(){ openPicker(S.pickingSeat); });
    foot.appendChild(back);
    sheet.appendChild(foot);
  }

  function closePicker(){ $("picker").hidden = true; S.pickingSeat = null; }
  $("picker").addEventListener("click", function(e){ if (e.target === $("picker")) closePicker(); });
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closePicker(); });

  function pasteFallback(msg){
    var sheet = $("sheet");
    sheet.innerHTML = "";
    var h = document.createElement("h3"); h.textContent = "Paste a key";
    var hint = document.createElement("p"); hint.className = "hint"; hint.textContent = msg;
    var inp = document.createElement("input");
    inp.type = "password"; inp.placeholder = "sk-or-v1-..."; inp.style.width = "100%";
    inp.autocomplete = "off";
    var foot = document.createElement("div"); foot.className = "sheetfoot";
    var use = document.createElement("button");
    use.className = "tiny"; use.type = "button"; use.textContent = "Use this key";
    use.addEventListener("click", function(){ var k = inp.value.trim(); if (k) { closePicker(); adopt(k); } });
    var get = document.createElement("a");
    get.className = "tiny"; get.href = "https://openrouter.ai/keys"; get.target = "_blank";
    get.rel = "noopener"; get.textContent = "Get one"; get.style.textDecoration = "none";
    foot.appendChild(use); foot.appendChild(get);
    sheet.appendChild(h); sheet.appendChild(hint); sheet.appendChild(inp); sheet.appendChild(foot);
    $("picker").hidden = false;
    say("");
  }

  /* ---- the table ---- */
  var NS = "http://www.w3.org/2000/svg";
  var T = { cx: 450, cy: 310, rx: 344, ry: 248 }, VW = 900, VH = 620;
  function n(tag, attrs, parent){
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, String(attrs[k]));
    if (parent) parent.appendChild(e);
    return e;
  }
  function chair(i){
    var a = (-90 + i * 72) * Math.PI / 180;
    return { x: T.cx + T.rx * Math.cos(a), y: T.cy + T.ry * Math.sin(a) };
  }
  function anchor(i){
    var a = (-90 + i * 72) * Math.PI / 180;
    var x = Math.max(VW*0.17, Math.min(VW*0.83, T.cx + (T.rx+28) * Math.cos(a)));
    var y = Math.max(VH*0.12, Math.min(VH*0.88, T.cy + (T.ry+18) * Math.sin(a)));
    return { x: (x/VW)*100, y: (y/VH)*100 };
  }

  function seated(){ return S.seats.filter(Boolean); }

  function render(){
    var g = $("chairs"); g.innerHTML = "";

    /* The centre is never rebuilt — the question box lives inside it and
       rebuilding would drop the caret on every keystroke. Only the two
       blocks and the one line of text under the question change. */
    if (!S.key) {
      $("connect-block").hidden = false;
      $("ask-block").hidden = true;
      $("acct").hidden = true;
      $("bar").hidden = true;
    } else {
      $("connect-block").hidden = true;
      $("ask-block").hidden = false;
      $("acct").hidden = false;
      $("acct").textContent = "sign out";
      $("bar").hidden = false;
      var k = seated().length;
      $("seated-line").textContent = k ? k + " seated" : "all seats open";
    }

    for (var i = 0; i < MAX; i++) {
      (function(i){
        var p = chair(i), who = S.seats[i];
        var grp = n("g", { class: "seat-hit", tabindex: 0, role: "button" }, g);
        grp.setAttribute("aria-label", who ? who.name + ", seat " + (i+1) : "Open seat " + (i+1));

        if (!who) {
          n("circle", { cx: p.x, cy: p.y, r: 26, class: "chair-empty" }, grp);
          var lbl = n("text", { x: p.x, y: p.y + 46, "text-anchor": "middle", class: "seat-label" }, grp);
          lbl.textContent = "SEAT OPEN";
        } else {
          var hue = who.brand.hue;
          var speaking = S.speaking === i;
          grp.setAttribute("class", "seat-hit figure" + (speaking ? " speaking" : (S.speaking !== null ? " idle" : "")));
          n("circle", { class: "ring2", cx: p.x, cy: p.y+2, r: 38, fill: "none", stroke: hue, "stroke-width": 1.6 }, grp);
          n("circle", { class: "halo", cx: p.x, cy: p.y+2, r: 40, fill: "none", stroke: hue, "stroke-width": 3 }, grp);
          var body = n("g", { class: "body-g" }, grp);
          body.style.transformOrigin = p.x + "px " + p.y + "px";
          body.style.animationDelay = (-(i * 0.79)).toFixed(2) + "s";
          n("path", { d: "M " + (p.x-22) + " " + (p.y+29) + " a 22 23 0 0 1 44 0 z", fill: hue, opacity: .93 }, body);
          n("circle", { cx: p.x, cy: p.y-5, r: 15.5, fill: hue }, body);
          n("circle", { cx: p.x-5, cy: p.y-10, r: 4.6, fill: "#FFF", opacity: .16 }, body);
          var th = n("g", { class: "think" }, grp);
          [-11,0,11].forEach(function(dx){ n("circle", { cx: p.x+dx, cy: p.y-33, r: 3.6, fill: "#EDE7DA" }, th); });
          var t1 = n("text", { x: p.x, y: p.y+48, "text-anchor": "middle", "font-family": "IBM Plex Mono, monospace", "font-size": 11, "letter-spacing": .8, fill: speaking ? hue : "#7C766A" }, grp);
          t1.textContent = who.brand.label.toUpperCase();
          var t2 = n("text", { x: p.x, y: p.y+62, "text-anchor": "middle", "font-family": "IBM Plex Mono, monospace", "font-size": 9, "letter-spacing": .5, fill: "#5E594E" }, grp);
          t2.textContent = who.name.length > 20 ? who.name.slice(0,19) + "\u2026" : who.name;
        }

        function act(){ if (!S.running && S.key) openPicker(i); }
        grp.addEventListener("click", act);
        grp.addEventListener("keydown", function(e){
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); }
        });
      })(i);
    }
    controls();
  }

  /* Grow the question box to fit what is written, so long questions stay
     centred on the felt instead of scrolling inside a two-line window. */
  function fitQuestion(){
    var q = $("question");
    q.style.height = "auto";
    q.style.height = Math.min(88, q.scrollHeight) + "px";
  }

  function controls(){
    var ready = seated().length >= 2 && $("question").value.trim();
    $("begin").disabled = S.running || !ready;
    $("pause").disabled = !S.running;
    $("stop").disabled = !S.running;
    if (!S.running) {
      var k = seated().length;
      say(k < 2 ? "Seat at least two." : (!$("question").value.trim() ? "Put a question on the table." : ""));
    }
  }
  function say(t, cls){ var e = $("status"); e.textContent = t || ""; e.className = "status" + (cls ? " " + cls : ""); }

  /* ---- bubbles + log ---- */
  function bubble(i, name, text){
    var w = $("bubbles"); w.innerHTML = "";
    var a = anchor(i);
    var d = document.createElement("div");
    d.className = "bubble";
    d.style.setProperty("--bx", a.x + "%"); d.style.setProperty("--by", a.y + "%");
    var h = document.createElement("span"); h.className = "who"; h.textContent = name;
    var p = document.createElement("span"); p.textContent = text;
    d.appendChild(h); d.appendChild(p); w.appendChild(d);
    return p;
  }
  function clearBubbles(){ $("bubbles").innerHTML = ""; }

  function drawLog(){
    var w = $("turns");
    $("log").hidden = !S.transcript.length;
    w.innerHTML = "";
    var last = null;
    S.transcript.forEach(function(t){
      var d = document.createElement("div");
      d.className = "turn" + (t.failed ? " failed" : "") + (t.human ? " human" : "");
      var m = document.createElement("div"); m.className = "mark";
      if (!t.human) m.style.background = t.hue || "#777";
      var b = document.createElement("div");
      var who = document.createElement("p"); who.className = "who"; who.textContent = t.name;
      var said = document.createElement("p"); said.className = "said"; said.textContent = t.text;
      b.appendChild(who); b.appendChild(said);
      d.appendChild(m); d.appendChild(b); w.appendChild(d);
      last = said;
    });
    return last;
  }

  /* ---- the round ---- */
  function promptFor(i, prior){
    var me = S.seats[i];
    var others = seated().filter(function(s){ return s !== me; })
                         .map(function(s){ return s.brand.label; });
    var L = [];
    L.push("You are one of several AI models answering the same question at a round table.");
    L.push("");
    L.push("THE QUESTION:");
    L.push($("question").value.trim());
    L.push("");
    L.push("ALSO AT THIS TABLE: " + (others.join(", ") || "nobody else") + ".");
    if ($("mode").value === "relay" && prior.length) {
      L.push(""); L.push("WHAT HAS BEEN SAID, in order:");
      prior.forEach(function(t){ L.push(t.name + ": " + t.text); });
      L.push("");
      L.push("You speak next. Answer the question, and engage directly with " +
             prior[prior.length-1].name + " — where you agree, where you do not, and what they missed. Name them.");
    } else if ($("mode").value === "relay") {
      L.push(""); L.push("You speak first.");
    }
    L.push("");
    L.push("Under 120 words. Plain paragraphs, no headings, no bullets.");
    L.push("Do not restate the question. Do not open with your own name.");
    L.push("Have a view and land it. Hedging into 'it depends' wastes the table's time.");
    return L.join("\n");
  }

  function ask(seat, prompt, onDelta){
    S.controller = new AbortController();
    return fetch(OR + "/chat/completions", {
      method: "POST", signal: S.controller.signal,
      headers: {
        "Authorization": "Bearer " + S.key, "Content-Type": "application/json",
        "HTTP-Referer": location.origin, "X-Title": "Round Table"
      },
      body: JSON.stringify({ model: seat.id, messages: [{ role: "user", content: prompt }], stream: true })
    }).then(function(res){
      if (!res.ok) {
        return res.json().catch(function(){ return null; }).then(function(j){
          var d = (j && j.error && j.error.message) ? " — " + j.error.message : "";
          if (res.status === 401) throw new Error("the key was rejected" + d);
          if (res.status === 402) throw new Error("out of credit on this OpenRouter account" + d);
          if (res.status === 429) throw new Error("rate limited, give it a minute" + d);
          throw new Error("HTTP " + res.status + d);
        });
      }
      var reader = res.body.getReader(), dec = new TextDecoder(), buf = "", text = "";
      function pump(){
        return reader.read().then(function(r){
          if (r.done) {
            if (!text.trim()) throw new Error("returned nothing");
            return text.trim();
          }
          buf += dec.decode(r.value, { stream: true });
          var parts = buf.split("\n");
          buf = parts.pop();
          parts.forEach(function(line){
            var t = line.trim();
            if (t.indexOf("data:") !== 0) return;
            var payload = t.slice(5).trim();
            if (payload === "[DONE]") return;
            var chunk;
            try { chunk = JSON.parse(payload); } catch(e){ return; }
            var d = chunk.choices && chunk.choices[0] && chunk.choices[0].delta && chunk.choices[0].delta.content;
            if (d) { text += d; onDelta(text); }
          });
          return pump();
        });
      }
      return pump();
    });
  }

  function runRound(){
    var laps = Number($("laps").value) || 2;
    var order = [];
    S.seats.forEach(function(s, i){ if (s) order.push(i); });
    S.running = true; S.stopping = false; S.paused = false; S.transcript = [];
    drawLog(); render();

    var lap = 0, k = 0;

    function step(){
      if (S.stopping || lap >= laps) return done();
      if (k >= order.length) { k = 0; lap++; return step(); }

      if (S.paused) { setTimeout(step, 250); return; }

      var i = order[k];
      var seat = S.seats[i];
      S.speaking = i; render();
      say(seat.brand.label + " is answering… (lap " + (lap+1) + " of " + laps + ")", "live");

      var bt = bubble(i, seat.brand.label + " · " + seat.name, "thinking…");
      var entry = { name: seat.brand.label + " · " + seat.name, hue: seat.brand.hue, text: "" };
      var logged = null;
      var prior = S.transcript.filter(function(t){ return t.text && !t.failed; });

      ask(seat, promptFor(i, prior), function(sofar){
        bt.textContent = sofar;
        if (!logged) { entry.text = sofar; S.transcript.push(entry); logged = drawLog(); }
        else { entry.text = sofar; logged.textContent = sofar; }
      }).then(function(text){
        entry.text = text;
        if (!logged) { S.transcript.push(entry); drawLog(); } else { logged.textContent = text; }
        bt.textContent = text;
        k++; setTimeout(step, 700 + Math.random() * 700);
      }).catch(function(e){
        if (e.name === "AbortError") { clearBubbles(); return done(); }
        entry.text = "(" + seat.brand.label + " did not answer: " + e.message + ")";
        entry.failed = true;
        if (!logged) S.transcript.push(entry);
        drawLog(); clearBubbles();
        k++; setTimeout(step, 700);
      });
    }

    function done(){
      var stopped = S.stopping;
      S.running = false; S.paused = false; S.stopping = false;
      S.speaking = null; S.controller = null;
      clearBubbles(); render();
      say(stopped ? "Stopped." : "Round over · " + S.transcript.length + " turns");
    }

    step();
  }

  /* ---- wiring ---- */
  $("begin").addEventListener("click", function(){ if (!S.running) runRound(); });
  $("pause").addEventListener("click", function(){
    S.paused = !S.paused;
    $("pause").textContent = S.paused ? "Resume" : "Pause";
    $("interject").hidden = !S.paused;
    if (S.paused) say("Paused after this turn.");
  });
  $("stop").addEventListener("click", function(){
    S.stopping = true; S.paused = false;
    if (S.controller) S.controller.abort();
  });
  $("say-it").addEventListener("click", function(){
    var t = $("say").value.trim();
    if (t) { S.transcript.push({ name: "You", text: t, human: true }); $("say").value = ""; drawLog(); }
    S.paused = false; $("pause").textContent = "Pause"; $("interject").hidden = true;
  });
  $("resume").addEventListener("click", function(){
    S.paused = false; $("pause").textContent = "Pause"; $("interject").hidden = true;
  });
  $("question").addEventListener("input", function(){ fitQuestion(); controls(); });
  $("connect-btn").addEventListener("click", connect);
  $("paste-link").addEventListener("click", function(){ pasteFallback("from openrouter.ai/keys"); });
  $("acct").addEventListener("click", signOut);
  $("copy").addEventListener("click", function(){
    var t = S.transcript.map(function(x){ return x.name + ":\n" + x.text; }).join("\n\n");
    navigator.clipboard.writeText("Round Table — " + $("question").value.trim() + "\n\n" + t)
      .then(function(){ $("copy").textContent = "Copied"; setTimeout(function(){ $("copy").textContent = "Copy"; }, 1500); })
      .catch(function(){});
  });
  $("clear").addEventListener("click", function(){ S.transcript = []; drawLog(); say(""); });

  /* ---- boot ---- */
  fitQuestion();
  var code = new URLSearchParams(location.search).get("code");
  if (code) { render(); finish(code); }
  else {
    var saved = getKey();
    if (saved) { S.key = saved; render(); loadModels(); }
    else render();
  }
})();
</script>
</body>
</html>
